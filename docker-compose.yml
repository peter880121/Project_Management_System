services:
  migrate:
    build: .
    image: medpm-ai:local
    command: ["pnpm", "db:deploy"]
    restart: "no"
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://${MYSQL_USER:-medpm}:${MYSQL_PASSWORD:-change-me-local-only}@mysql:3306/${MYSQL_DATABASE:-medpm}?charset=utf8mb4
    depends_on:
      mysql:
        condition: service_healthy

  app:
    build: .
    image: medpm-ai:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in the environment or .env file}
      DATABASE_URL: mysql://${MYSQL_USER:-medpm}:${MYSQL_PASSWORD:-change-me-local-only}@mysql:3306/${MYSQL_DATABASE:-medpm}?charset=utf8mb4
      MILVUS_ADDRESS: milvus:19530
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-medpm}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-me-local-only}
      MINIO_BUCKET: ${MINIO_BUCKET:-medpm-documents}
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
      milvus:
        condition: service_started
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root-local-only}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-medpm}
      MYSQL_USER: ${MYSQL_USER:-medpm}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me-local-only}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u$$MYSQL_USER", "-p$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    restart: unless-stopped
    command: >-
      etcd --name=etcd --data-dir=/etcd
      --advertise-client-urls=http://etcd:2379
      --listen-client-urls=http://0.0.0.0:2379
      --initial-advertise-peer-urls=http://etcd:2380
      --listen-peer-urls=http://0.0.0.0:2380
      --initial-cluster=etcd=http://etcd:2380
      --initial-cluster-state=new
    volumes:
      - etcd_data:/etcd

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-medpm}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-local-only}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c 'mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
      mc mb --ignore-existing local/$${MINIO_BUCKET} &&
      mc mb --ignore-existing local/$${MILVUS_BUCKET}'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-medpm}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-local-only}
      MINIO_BUCKET: ${MINIO_BUCKET:-medpm-documents}
      MILVUS_BUCKET: ${MILVUS_BUCKET:-milvus-data}

  milvus:
    image: milvusdb/milvus:v2.6.2
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_BUCKET_NAME: ${MILVUS_BUCKET:-milvus-data}
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-medpm}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-change-me-local-only}
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: ["async"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  etcd_data:
  minio_data:
  milvus_data:
  redis_data:
